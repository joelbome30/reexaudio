[package]
name = "reexaudio"
version = "0.3.4"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:slint-build", "dep:qrcode"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
qrcode = { version = "0.14", optional = true, default-features = false }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.29"
tempfile = "3"

[[bin]]
name = "reexaudio"
path = "src/bin/reexaudio.rs"
required-features = ["desktop"]

[[bin]]
name = "reexaudio-server"
path = "src/bin/server.rs"

[profile.dev]
debug = 0
opt-level = 1

[profile.release]
strip = true

[[example]]
name = "preview"
required-features = ["desktop"]
